<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mossgrove</title>
    <!--
      Nothing remote, ever (SPEC.md §2): scripts, styles, frames and requests come from the app itself. Inline scripts
      are allowed for Capacitor's bridge, which Android injects into this page; data: images and requests for the
      icons Ionic's own components draw inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' data:; frame-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
