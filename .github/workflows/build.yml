# When CI runs, and how much of it. The jobs themselves are in ci.yml, which release.yml calls too.
#
#   a push to main, a pull request    the fast checks only: typecheck, lint, Vitest, Playwright in Chromium and WebKit,
#                                     the APK and the zipped Simulator .app (about 7 minutes; one ubuntu and one macos
#                                     job side by side)
#   "Run workflow", every Monday      the fast checks and the device suite: the .app on an iOS 26 simulator (about
#                                     10 minutes more in the macos job)
#
# A push or a pull request that changes only the files below starts nothing: no test, no build step and no script reads
# them (Playwright writes docs/screenshots/, and nothing reads it). SPEC.md, nthcase/ and art/ are NOT here: the tests,
# the Playwright walk and scripts/convert-art.mjs read them.
#
# A newer push to the same branch or pull request cancels the older run. "Run workflow" and the weekly run are never
# cancelled by a push, and release.yml has no concurrency at all: a release always runs to its end.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  workflow_dispatch:
  schedule:
    # Monday 03:17 UTC: the device suite once a week, so drift in the runner's simulators is still caught
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: build-${{ github.run_number }}
      devices: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
