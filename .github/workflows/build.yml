# Builds and tests every pull request, every push to main, and on demand.
#
# Every action is named by its commit, not by a tag someone can move. The version each SHA was on 2026-11-03 is in the
# comment beside it. To update one, look up the new version's commit, read what changed, and change both.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Logic, the flows of scenarios 01–10 and the id census, in jsdom.
      - run: npm test
      - run: npm run build
      # The production build in Playwright's own browsers: Chromium light and dark (every screen, every id, the
      # screenshots) and WebKit, the engine of iOS's web view (every screen, every id).
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # The web build goes into the app: no server, no live reload.
      - run: npx cap sync android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --no-daemon --max-workers=3 assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-ionic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build the Simulator app (arm64 and x86_64, unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/SourcePackages -jobs 4 \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p ../../dist-ios
          ditto -c -k --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/App.app ../../dist-ios/Mossgrove-simulator.zip
      - name: Install and open it on an iOS 26 simulator
        run: ./scripts/ci-simulator-smoke.sh build/smoke ios/App/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-ionic-simulator
          path: dist-ios/Mossgrove-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-smoke
          path: build/smoke/
          retention-days: 14
